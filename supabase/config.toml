# Supabase CLI configuration for this project.
#
# There are two functions. Both opt out of the platform's JWT check, and both
# authenticate for themselves — see the two sections below.
project_id = "xgcjjzwdkxykdosxdzhn"

[functions.admin-payment-proof]
# The Supabase gateway verifies an `Authorization: Bearer <token>` header as a
# JWT *it* issued — the anon key or a service-role key. This function is not
# called with either: the Flutter app sends the caller's **Firebase ID token**,
# because the app has no Supabase key and must not have one. The gateway would
# reject that token as an unknown issuer before the function ever ran, so every
# proof would fail with a bare 401.
#
# Turning the check off does not open the door. It moves the door. The function
# then authenticates for itself, and more strictly than the gateway would have:
#
#   1. `getAuth().verifyIdToken(token)` — proves the caller is who the token
#      says, against Firebase, with the service account. A forged or expired
#      token fails here.
#   2. `profiles/{uid}.role == 'admin'` in Firestore — proves the caller is the
#      Admin, not merely somebody with a valid account. The gateway never
#      checked this, and could not have.
#
# A guest with a perfectly valid Firebase token still gets 403 from step 2.
# Unauthenticated callers still get 401 from step 1. Nothing is served to
# anybody but the Admin, and no proof URL is signed for anyone else.
verify_jwt = false

[functions.admin-pin-reset]
# Same reasoning as the proof function above, and the same reason it is not a
# risk: the caller sends a **Firebase** ID token, which the Supabase gateway
# would reject as a foreign issuer before the function ever ran. The function
# verifies that token itself with the service account, then reads
# `profiles/{uid}.role`, then insists the address is verified — three checks the
# gateway never made.
#
# A Guest with a perfect Firebase token still gets 403. An unverified Admin gets
# 403. Nobody else causes a code to exist, let alone a PIN record to be deleted.
#
# Secrets it needs (none of them in the repository):
#   supabase secrets set GMAIL_SMTP_USER=your-gmail@gmail.com
#   supabase secrets set GMAIL_SMTP_APP_PASSWORD=your-app-password
#   supabase secrets set BOOTSTRAP_ADMIN_EMAILS="gemaojohnreyarguilles@gmail.com"
verify_jwt = false
