name: hacienda_de_luisana
description: "Hacienda de LuisAna - Admin app (bookings, payments, rates, stays, chat, smart locks)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management & Service Locator
  flutter_riverpod: ^2.5.1
  # Backend & Real-time Database
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  # The ephemeral live-location stream (ADR-0013). Realtime Database rather
  # than Firestore because the server deletes a TTL'd node for us and bills
  # bandwidth rather than a write per GPS fix; the rules that guard it are
  # database.rules.json.
  firebase_database: ^12.6.0
  # Charts & Visuals
  fl_chart: ^0.67.0
  # UI, Icons, Helpers & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.2.6
  cached_network_image: ^3.3.1
  # PBKDF2-HMAC-SHA256 for the Security PIN (ADR-0015) — the same stretch
  # the website's demo mode applies to passwords (src/lib/authLocal.ts).
  # The Dart team's package; PBKDF2 itself is the 20-line loop in
  # pin_store.dart built on this package's HMAC/SHA-256.
  crypto: ^3.0.3
  # Calls the Supabase function that signs a payment-proof URL (ADR-0011).
  http: ^1.2.0
  flutter_local_notifications: ^17.1.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_sign_in: ^7.2.0
  firebase_app_check: ^0.4.8
  # Local persistence — the guided tour remembers completion on-device.
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Brand generators — build-time only. Neither package is imported by the app
  # (no FlutterNativeSplash.preserve()/remove() in main.dart), so both belong in
  # dev_dependencies and nothing here ships in the bundle. Run after `pub get`:
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

# -----------------------------------------------------------------------------
# LAUNCHER ICONS — from the client's own brand mark
# -----------------------------------------------------------------------------
# icon-full-bleed.png is the supplied icon.png with its white corner mat
# replaced by the artwork's own green; assets/icons/README.md carries the exact
# command. The original is kept untouched beside it.
flutter_launcher_icons:
  image_path: "assets/icons/icon-full-bleed.png"
  android: true
  ios: true
  # Android 8+ masks the icon and crops roughly a third of the foreground, so
  # the adaptive foreground is given the full-bleed artwork with a small inset
  # and the same green behind it — what the launcher reveals past the mark is
  # that green, never a white notch, whatever mask shape the OEM uses.
  min_sdk_android: 21
  adaptive_icon_background: "#2d502f"
  adaptive_icon_foreground: "assets/icons/icon-full-bleed.png"
  adaptive_icon_foreground_inset: 10

# -----------------------------------------------------------------------------
# NATIVE SPLASH — the loading screen, before Flutter paints its first frame
# -----------------------------------------------------------------------------
# The field colour is sampled from splash.png itself (srgb(15,32,16)) so the
# band around the artwork on a tall screen is indistinguishable from the
# artwork. No *_dark variants: app_theme.dart is Brightness.light only, so a
# dark splash would be the one place the app contradicted itself.
flutter_native_splash:
  color: "#0f2010"
  image: assets/splash/splash.png
  android_gravity: center
  ios_content_mode: center
  # Android 12+ ignores the block above and composes a window colour plus a
  # centre icon clipped to a circle, which is what splash-android12.png is
  # sized for: the 1152px canvas the platform asks for, mark inside the 768px
  # safe circle. Derived from the same artwork — see assets/splash/README.md.
  android_12:
    color: "#0f2010"
    image: assets/splash/splash-android12.png

flutter:
  uses-material-design: true
  assets:
    - assets/
