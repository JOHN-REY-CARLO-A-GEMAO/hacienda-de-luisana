name: hacienda_de_luisana
description: "Hacienda de LuisAna - Admin app (bookings, payments, rates, stays, tracking, smart locks)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management & Service Locator
  flutter_riverpod: ^2.5.1
  # Backend & Real-time Database
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_messaging: ^14.8.0
  # Maps & Location
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  # Charts & Visuals
  fl_chart: ^0.67.0
  # UI, Icons, Helpers & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.2.6
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^17.1.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_sign_in: ^7.2.0
  firebase_app_check: ^0.2.2+7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
