publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  url_launcher: ^6.2.5
  image_picker: ^1.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_app_check: ^0.3.2+10
  google_sign_in: ^6.2.1
  flutter_blue_plus: ^2.3.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
